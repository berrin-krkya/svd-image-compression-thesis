title: Approximation matricielle de faible rang pour la compression d'images par SVD
author: Berrïn Karakaya
copyright: "2026 Berrïn Karakaya"

execute:
  execute_notebooks: off

exclude_patterns:
  - _build

repository:
  url: https://github.com/berrin-krkya/svd-image-compression-thesis
  path_to_book: book
  branch: main

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - deflist
    - html_admonition
    - html_image

launch_buttons:
  thebe: false

html:
  use_issues_button: false
  use_repository_button: true
  use_download_button: true
  use_fullscreen_button: true
  home_page_in_navbar: true
  baseurl: https://berrin-krkya.github.io/svd-image-compression-thesis

sphinx:
  config:
    # Publish the original LaTeX manuscript, images and PDF (rapports/) next
    # to the built book so links such as ../rapports/main_current.pdf resolve
    # on the deployed site.
    html_extra_path:
      - ../rapports
    # main.tex defines \R \N \C \Z \Q as shorthands for \mathbf{R} etc.
    # These macros let the equations render correctly without rewriting the
    # original LaTeX source.
    mathjax3_config:
      tex:
        macros:
          R: "\\mathbf{R}"
          N: "\\mathbf{N}"
          C: "\\mathbf{C}"
          Z: "\\mathbf{Z}"
          Q: "\\mathbf{Q}"
