name: deploy-book

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Jupyter Book
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter-book>=1.0"

      - name: Build the book (debug)
        run: |
          echo "=== Repo içeriği ==="
          ls -la
          echo "=== Config dosyaları ==="
          ls -la _config.yml _toc.yml myst.yml 2>/dev/null || echo "Config dosyası bulunamadı"
          echo "=== Build başlıyor ==="
          jupyter-book build . --all
          echo "=== Build sonrası ==="
          ls -la
          ls -la _build || echo "_build YOK"
          ls -la _build/html || echo "_build/html YOK"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
